name: Deploy Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AUTH_LAMBDA_FUNCTION_NAME: moderate-api-auth-lambda
      DASHBOARD_LAMBDA_FUNCTION_NAME: moderate-api-dashboard-lambda
      BILLING_LAMBDA_FUNCTION_NAME: moderate-api-billing-lambda
      MODERATION_LAMBDA_FUNCTION_NAME: moderate-api-lambda
      WEBHOOK_LAMBDA_FUNCTION_NAME: moderate-api-webhook-lambda

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Package Lambdas
        run: |
          zip -r -FS function.zip dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Auth Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$AUTH_LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://function.zip

      - name: Wait for Auth Lambda Code
        run: |
          aws lambda wait function-updated \
            --function-name "$AUTH_LAMBDA_FUNCTION_NAME"

      - name: Configure Auth Lambda Handler
        run: |
          aws lambda update-function-configuration \
            --function-name "$AUTH_LAMBDA_FUNCTION_NAME" \
            --handler dist/auth-main.handler

      - name: Wait for Auth Lambda Configuration
        run: |
          aws lambda wait function-updated \
            --function-name "$AUTH_LAMBDA_FUNCTION_NAME"

      - name: Deploy Dashboard Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$DASHBOARD_LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://function.zip

      - name: Wait for Dashboard Lambda Code
        run: |
          aws lambda wait function-updated \
            --function-name "$DASHBOARD_LAMBDA_FUNCTION_NAME"

      - name: Configure Dashboard Lambda Handler
        run: |
          aws lambda update-function-configuration \
            --function-name "$DASHBOARD_LAMBDA_FUNCTION_NAME" \
            --handler dist/dashboard-main.handler

      - name: Wait for Dashboard Lambda Configuration
        run: |
          aws lambda wait function-updated \
            --function-name "$DASHBOARD_LAMBDA_FUNCTION_NAME"

      - name: Deploy Billing Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$BILLING_LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://function.zip

      - name: Wait for Billing Lambda Code
        run: |
          aws lambda wait function-updated \
            --function-name "$BILLING_LAMBDA_FUNCTION_NAME"

      - name: Configure Billing Lambda Handler
        run: |
          aws lambda update-function-configuration \
            --function-name "$BILLING_LAMBDA_FUNCTION_NAME" \
            --handler dist/billing-main.handler

      - name: Wait for Billing Lambda Configuration
        run: |
          aws lambda wait function-updated \
            --function-name "$BILLING_LAMBDA_FUNCTION_NAME"

      - name: Deploy Moderation Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$MODERATION_LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://function.zip

      - name: Wait for Moderation Lambda Code
        run: |
          aws lambda wait function-updated \
            --function-name "$MODERATION_LAMBDA_FUNCTION_NAME"

      - name: Configure Moderation Lambda Handler
        run: |
          aws lambda update-function-configuration \
            --function-name "$MODERATION_LAMBDA_FUNCTION_NAME" \
            --handler dist/moderation-main.handler

      - name: Wait for Moderation Lambda Configuration
        run: |
          aws lambda wait function-updated \
            --function-name "$MODERATION_LAMBDA_FUNCTION_NAME"

      - name: Deploy Webhook Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$WEBHOOK_LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://function.zip

      - name: Wait for Webhook Lambda Code
        run: |
          aws lambda wait function-updated \
            --function-name "$WEBHOOK_LAMBDA_FUNCTION_NAME"

      - name: Configure Webhook Lambda Handler
        run: |
          aws lambda update-function-configuration \
            --function-name "$WEBHOOK_LAMBDA_FUNCTION_NAME" \
            --handler dist/webhook-main.handler

      - name: Wait for Webhook Lambda Configuration
        run: |
          aws lambda wait function-updated \
            --function-name "$WEBHOOK_LAMBDA_FUNCTION_NAME"
